# 复制以下内容，到 GitHub 网页新建文件 .github/workflows/stats.yml 粘贴并提交即可。
# 说明见下，但本文件本身即可直接作为 workflow 使用。
name: 每日统计快照

on:
  schedule:
    - cron: "17 1 * * *"      # UTC 01:17 = 北京 09:17，每天跑一次
  workflow_dispatch:          # 也可在 Actions 页面手动点 Run workflow 测试

permissions:
  contents: write             # 用 GITHUB_TOKEN 自动提交 assets/stats.json

concurrency:
  group: stats-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 GitHub Releases 下载数
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/collect_stats.py

      - name: 有变化才存档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          if git diff --staged --quiet; then
            echo "数字没变化，跳过提交"
          else
            git commit -m "统计快照 $(date -u +%F)"
            git push
          fi
