name: 每日统计快照

# 这个文件放在 scripts/ 下不会因为 GitHub Actions 的 token 权限被拒。
# 想启用每日存档：把本文件内容复制到仓库的 .github/workflows/stats.yml
# （在 GitHub 网页上新建文件即可，用网页会话不需要额外 token scope）。

# 每天 UTC 01:17（北京 09:17）把真实的下载数存档一次。
# 只在数字变化时提交，避免把 commit 历史刷成流水账。
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 抓取 GitHub Releases 下载数
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/collect_stats.py

      - name: 有变化才存档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.json
          if git diff --staged --quiet; then
            echo "数字没变化，跳过提交"
          else
            git commit -m "统计快照 $(date -u +%F)"
            git push
          fi
